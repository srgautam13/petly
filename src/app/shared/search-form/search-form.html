<form (ngSubmit)="onSearch()" class="search-form">
  <div class="form-row">
    <mat-form-field>
      <mat-label>Location</mat-label>
      <input matInput [(ngModel)]="searchData.location" name="location" placeholder="Enter city or zip code">
    </mat-form-field>
    
    <mat-form-field>
      <mat-label>Start Date</mat-label>
      <input matInput [matDatepicker]="startPicker" [(ngModel)]="searchData.startDate" name="startDate">
      <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
      <mat-datepicker #startPicker></mat-datepicker>
    </mat-form-field>
    
    <mat-form-field>
      <mat-label>End Date</mat-label>
      <input matInput [matDatepicker]="endPicker" [(ngModel)]="searchData.endDate" name="endDate">
      <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
      <mat-datepicker #endPicker></mat-datepicker>
    </mat-form-field>
    
    <button mat-raised-button color="primary" type="submit">Search Sitters</button>
  </div>
</form>
